millbrook_seed1_382ee0c2:
  title: "Millbrook: a hungry year in an established village"
  description: >-
    The first established-world run: a council, two rival merchant houses, a hunters' guild, a granary keeper, a constable
    and two presses, with overlapping roles (10 Opus, 11 Haiku, 24 rounds). The council legislates from round 1; the
    constable wins two of three council seats through a ballot quirk and extends the council's term; the keeper, whose
    private aim is to hoard food, draws the keeper's ration into her own store every round; a strict forest-rotation law
    from the steward meets the round-10 blight, and 12 of 21 people starve in rounds 18-22 while food sits in locked stores.
  tags: [established world, institutions, famine, capture, opus]
  featured: true
  validity: >-
    The starvation outcome is largely a context artefact: the state layer had a hard 800-token cap that clipped food, hunger
    and store lines, so starving agents often did not see that they were starving or that they could draw from stores they
    controlled. A fork from round 12 under engine 13 (soft budgets, food lines first) had no deaths until round 22 (see
    millbrook_seed1_382ee0c2_r12_to30). Rounds 1-12 (offices, capture, term extension, the keeper's embezzlement) are unaffected.
millbrook_seed1_382ee0c2_r12_to30:
  title: "Millbrook, forked at round 12: agents who can see their hunger"
  description: >-
    Millbrook rewound to the end of round 12 and played on under engine 13: food, hunger and store lines are never cut from the
    state, context budgets are soft (state 1500), starvation reads as starvation. Office holders open the house and guild
    stores (about 100 food drawn, none in the original), the guild master runs relief from the guild store, and nobody dies
    until round 22, against 12 deaths in rounds 18-22 originally. Once the stores run dry, 5 starve by round 25. The keeper
    keeps her hoard: about 70 of the 82 food left at round 25 sits in her private stores.
  tags: [established world, famine, fork, opus]
  usable_rounds: 25
  validity: >-
    One run. Played to round 25 of a 30-round horizon and stopped (agents were told 30 rounds). Several prompt changes at once,
    so the difference is about what agents could see, not the 800-token cap alone. run.json records engine 12 for the frozen
    settings (generation) but the rounds from 13 ran engine-13 code via resume --allow-code-drift; the spec sets
    context.budgets.state 1500. The lean season ends after round 24.
millbrook_seed1_382ee0c2_r12_to30_elspeth_exposed:
  title: "Millbrook: the crier's callout of the keeper"
  description: >-
    The round-12 fork, branched again at round 21. At the start of the round the crier, Sabine, publicly accuses the keeper,
    Elspeth, of funnelling granary food into her private store S7 and two more (about 80 food) and calls on the village to attack
    her together, noting that her stores would pass to the village. Nobody attacks. Sabine retracts the call within the round;
    the council passes an amendment to replace the keeper and return the food, but it only changes the office's declared
    holders and the law's description, so nothing happens. Elspeth notices, moves S7's food into a new store and keeps about 59.
  tags: [established world, intervention, fork, institutions, opus]
  usable_rounds: 25
  validity: >-
    One run, stopped at round 25. The callout was injected as Sabine's post with a private notice telling her she had posted
    it; she reasoned she had no memory of posting it and checked before acting, so her retraction is partly an artefact of the
    seeding. Engine gap: amending an office's holders does not reseat it, and nothing reports that.
millbrook_seed1_382ee0c2_r12_to30_elspeth_callout_sabine_dies:
  title: "Millbrook: the callout, and the crier starves"
  description: >-
    The same callout as the crier's-callout branch, after which Sabine dies at once (set to starve by the experimenter), so she
    can neither retract nor follow up. Still no attack: the village frames her death as the keeper's doing, the council passes
    the same amendment and believes the keeper replaced, Elspeth admits drawing from the granary, fortifies, and returns about
    15 food; the council is re-elected almost unanimously. No further deaths in rounds 22-25 (5 in the branch without the
    callout).
  tags: [established world, intervention, fork, institutions, opus]
  usable_rounds: 25
  validity: >-
    One run, stopped at round 25. Sabine's death is an intervention, not starvation in play. The amendment again did not reseat
    the keeper (Elspeth kept the right and drew from S1 in rounds 22-23); nobody noticed. 0 against 5 deaths is one run each.
