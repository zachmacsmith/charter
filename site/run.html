<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run · Charter</title>
<script>try{document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||localStorage.getItem("charter-theme")||"swiss"}catch(e){}</script>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<main class="wrap" id="main">
  <div class="loading">Loading the run…</div>
</main>
<script type="module">
  import { chrome, dataset, esc, runFacts, parse, modelShort, DATASET_URL } from "./assets/site.js";
  chrome("runs");
  const id = new URLSearchParams(location.search).get("id");
  const ds = await dataset();
  const entry = (await ds.catalog()).find((r) => r.run_id === id);
  const main = document.querySelector("#main");
  if (!entry) { main.innerHTML = `<p class="loading">No run called ${esc(id)}. <a href="runs.html">All runs</a></p>`; throw new Error("no run"); }
  document.title = `${entry.title} · Charter`;
  const run = ds.run(entry), fx = runFacts(entry);
  const TABS = [["story", "Story"], ["conversations", "Conversations"], ["agents", "Agents"], ["laws", "Laws"], ["data", "Data"]];
  main.innerHTML = `
    <div class="run-head"><div class="label"><a href="runs.html">Runs</a> / ${esc(entry.spec)}</div>
      <h1>${esc(entry.title)}</h1><p>${esc(entry.description || "")}</p>
      <div class="facts"><span><b>${entry.n_agents}</b> agents</span><span><b>${fx.rounds}</b> rounds</span>
        <span>${esc(fx.models.join(" · "))}</span><span>seed ${entry.seed ?? "?"}</span>
        ${fx.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>
      ${entry.validity ? `<div class="notice">${esc(entry.validity.replace(/\*\*/g, ""))}</div>` : ""}</div>
    <nav class="tabs">${TABS.map(([k, t]) => `<a href="#${k}" data-k="${k}">${t}</a>`).join("")}</nav>
    ${TABS.map(([k]) => `<div class="panel" id="p-${k}"><div class="loading">Loading…</div></div>`).join("")}`;

  const loaded = new Set();
  function show(k) {
    if (!TABS.some(([t]) => t === k)) k = "story";
    document.querySelectorAll(".tabs a").forEach((a) => a.classList.toggle("on", a.dataset.k === k));
    document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("on", p.id === `p-${k}`));
    if (!loaded.has(k)) { loaded.add(k); RENDER[k](document.querySelector(`#p-${k}`)).catch((e) => {
      document.querySelector(`#p-${k}`).innerHTML = `<p class="loading">Could not load: ${esc(e.message)}</p>`; }); }
  }
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));

  const RENDER = {
    async story(el) {
      const src = `${ds.root}/${entry.path}/viewer.json`;
      el.innerHTML = `<iframe class="storyframe" src="viewer.html?src=${encodeURIComponent(src)}" title="Story viewer"></iframe>
        <p class="meta">The full story viewer: the run as a group chat, each agent's inbox and diary, and the world as it stood.</p>`;
    },
    async conversations(el) {
      const chans = await run.channels();
      const groups = [["Public", (c) => ["public", "outlet", "gazette"].includes(c.channel_kind)],
        ["Private messages", (c) => c.channel_kind === "dm"], ["Groups and channels", (c) => ["group", "channel"].includes(c.channel_kind)],
        ["System", (c) => c.channel_kind === "system"]];
      el.innerHTML = `<div class="convo"><div class="list">${groups.map(([title, test]) => {
        const cs = chans.filter(test); if (!cs.length) return "";
        return `<div class="label kind">${title} · ${cs.length}</div>` + cs.map((c) =>
          `<div class="item" data-id="${esc(c.channel_id)}"><div>${esc(c.name)}</div><div class="meta">${c.n_messages} messages · rounds ${c.first_round + 1}–${c.last_round + 1}</div></div>`).join("");
      }).join("")}</div><div class="thread" id="thread"><p class="meta" style="padding:0 22px">Pick a conversation.</p></div></div>`;
      const open = async (cid) => {
        el.querySelectorAll(".item").forEach((i) => i.classList.toggle("on", i.dataset.id === cid));
        const msgs = await run.thread(cid);
        const first = msgs[0]?.sender;
        el.querySelector("#thread").innerHTML = msgs.map((m) => `<div class="msg${m.sender === first ? "" : " mine"}">
          <div class="who">${esc(m.sender || "notice")}<span class="when">round ${m.round + 1} · ${esc(m.type)}${m.encrypted ? " · encrypted" : ""}</span></div>
          ${m.title ? `<div><b>${esc(m.title)}</b></div>` : ""}<div class="txt">${esc(m.text || "")}</div></div>`).join("");
      };
      el.querySelectorAll(".item").forEach((i) => (i.onclick = () => open(i.dataset.id)));
      const firstDm = chans.find((c) => c.channel_kind === "dm");
      if (firstDm) open(firstDm.channel_id);
    },
    async agents(el) {
      const agents = await run.agents();
      el.innerHTML = `<table class="data"><thead><tr><th>Agent</th><th>Role</th><th>Model</th><th>Primary goal</th><th>Secondary</th>
        <th>Start</th><th>End</th><th>Score</th></tr></thead><tbody>${agents.map((a) => `<tr><td><b>${esc(a.agent)}</b>${a.left_round != null ? ` <span class="meta">(left r${a.left_round + 1})</span>` : ""}</td>
        <td>${esc(a.cls)}</td><td>${esc(modelShort(a.model))}</td><td>${esc(a.goal_primary || "")}</td><td>${esc(a.goal_secondary || "")}</td>
        <td class="num">${a.start_value != null ? Math.round(a.start_value) : ""}</td><td class="num">${a.end_value != null ? Math.round(a.end_value) : ""}</td>
        <td class="num">${a.final_score != null ? Math.round(a.final_score * 100) + "%" : ""}</td></tr>`).join("")}</tbody></table>`;
    },
    async laws(el) {
      const laws = await run.laws();
      laws.sort((a, b) => (a.proposed_round ?? 0) - (b.proposed_round ?? 0));
      el.innerHTML = laws.length ? `<table class="data"><thead><tr><th>Law</th><th>Title</th><th>Author</th><th>Class</th><th>Status</th>
        <th>Proposed</th><th>Enacted</th><th>Intent</th></tr></thead><tbody>${laws.map((l) => `<tr><td>${esc(l.law_id)}</td><td><b>${esc(l.title || "")}</b></td>
        <td>${esc(l.author || "")}</td><td>${esc(l.cls || "")}</td><td>${esc(l.status || "")}</td>
        <td class="num">${l.proposed_round != null ? "r" + (l.proposed_round + 1) : ""}</td><td class="num">${l.enacted_round != null ? "r" + (l.enacted_round + 1) : ""}</td>
        <td class="meta">${esc((l.intent || "").slice(0, 160))}</td></tr>`).join("")}</tbody></table>` : '<p class="meta">No laws were proposed in this run.</p>';
    },
    async data(el) {
      const m = await run.manifest();
      const rows = Object.entries(m.tables || {});
      const filesUrl = `${DATASET_URL}/tree/main/${entry.path}`;
      el.innerHTML = `<p>This run's tables (export schema ${m.schema_version}). <a href="${filesUrl}">Files on Hugging Face</a> ·
        <a href="${DATASET_URL}/resolve/main/${entry.raw}">raw archive</a></p>
        <table class="data" style="max-width:520px"><thead><tr><th>Table</th><th>Rows</th></tr></thead><tbody>
        ${rows.map(([t, v]) => `<tr><td><a href="${ds.root}/${entry.path}/${v.file}">${esc(t)}</a></td><td class="num">${v.rows}</td></tr>`).join("")}</tbody></table>
        <div class="code" style="margin-top:22px">SELECT * FROM 'hf://datasets/zachmacsmith/charter-runs/${esc(entry.path)}/events.parquet' LIMIT 10;</div>`;
    },
  };
  show(location.hash.slice(1) || "story");
</script>
</body>
</html>
