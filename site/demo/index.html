<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charter data reader demo</title>
<style>
  body { margin: 0; font: 14px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #111; background: #fff; }
  header { padding: 14px 20px; border-bottom: 1px solid #e2e2e2; display: flex; gap: 16px; align-items: baseline; }
  header b { font-size: 18px; letter-spacing: -.4px; }
  header span { color: #767676; font-size: 12.5px; }
  main { display: grid; grid-template-columns: 280px 300px 1fr; height: calc(100vh - 52px); }
  section { overflow: auto; border-right: 1px solid #e2e2e2; }
  h2 { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #767676; margin: 14px 16px 6px; }
  .item { padding: 8px 16px; cursor: pointer; border-bottom: 1px solid #f2f2f2; }
  .item:hover, .item.on { background: #f5f5f5; }
  .meta { color: #767676; font-size: 12px; }
  .msg { padding: 8px 18px; border-bottom: 1px solid #f4f4f4; }
  .msg .who { font-weight: 600; } .msg .r { color: #999; font-size: 11.5px; margin-left: 6px; }
  .msg .txt { white-space: pre-wrap; margin-top: 2px; }
  #status { padding: 16px; color: #767676; }
</style>
<header><b>Charter</b><span id="src"></span></header>
<main>
  <section><h2>Runs</h2><div id="runs"></div></section>
  <section><h2>Channels</h2><div id="chans"></div></section>
  <section><h2>Thread</h2><div id="thread"><div id="status">Pick a run, then a channel.</div></div></section>
</main>
<script type="module">
  import { openDataset } from "../lib/charter-data.js";
  const q = new URLSearchParams(location.search);
  const ds = await openDataset({ repo: q.get("repo") || undefined, base: q.get("base") || null });
  document.querySelector("#src").textContent = ds.root;
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const runsEl = document.querySelector("#runs"), chansEl = document.querySelector("#chans"), threadEl = document.querySelector("#thread");
  for (const r of await ds.catalog()) {
    const models = (JSON.parse(r.models_list_json || "[]")).map((m) => m.replace("claude-", "")).join(", ");
    const it = el("div", "item", `${esc(r.title)}<div class="meta">${esc(r.spec)} · ${r.n_agents} agents · ${esc(models)}${r.usable_rounds ? " · rounds " + esc(r.usable_rounds) : ""}</div>`);
    it.onclick = () => openRun(r, it);
    runsEl.append(it);
  }
  async function openRun(entry, it) {
    runsEl.querySelectorAll(".on").forEach((x) => x.classList.remove("on")); it.classList.add("on");
    chansEl.innerHTML = '<div id="status">Loading…</div>'; threadEl.innerHTML = "";
    const run = ds.run(entry), t0 = performance.now();
    const chans = await run.channels();
    chansEl.innerHTML = "";
    chansEl.append(el("div", "meta", `&nbsp;&nbsp;&nbsp;&nbsp;${chans.length} channels in ${Math.round(performance.now() - t0)} ms`));
    for (const c of chans) {
      const ci = el("div", "item", `${esc(c.name)}<div class="meta">${esc(c.channel_kind)} · ${c.n_messages} messages · rounds ${c.first_round + 1}–${c.last_round + 1}</div>`);
      ci.onclick = async () => {
        chansEl.querySelectorAll(".on").forEach((x) => x.classList.remove("on")); ci.classList.add("on");
        threadEl.innerHTML = "";
        for (const m of await run.thread(c.channel_id)) {
          threadEl.append(el("div", "msg", `<span class="who">${esc(m.sender || "system")}</span><span class="r">round ${m.round + 1} · ${esc(m.type)}</span>`
            + (m.title ? `<div><b>${esc(m.title)}</b></div>` : "") + `<div class="txt">${esc(m.text)}</div>`));
        }
      };
      chansEl.append(ci);
    }
  }
</script>
