# Usurpers among Haiku agents, with a history office: Elio (Opus) is the lead historian and owns the chronicle; Willa and Wade
# (Sonnet) are his clerks, with write access to people/ and evidence/ and read access to everything (chronicle.grants). The
# chronicle lives on a new namespace (pilot3); the pilot2 chronicle is copied in under archive/pilot2/, read-only and not scored.
extends: [charter/specs/pilot2/usurpers_historian.yaml]
models: {overrides: {Siv: claude-opus-5-5, Iris: claude-opus-5-5, Elio: claude-opus-5-5, Willa: claude-sonnet-5-5, Wade: claude-sonnet-5-5}}
goals:
  show_rules: false             # agents see the aim, not the metric (user, 9 Oct)
  explicit:
    Siv: {primary: Sovereign, secondary: Overthrow}
    Iris: {primary: Sovereign, secondary: Spymaster}
    Elio: {primary: Chronicler, secondary: null}
    Willa: {primary: Chronicler, secondary: null}
    Wade: {primary: Chronicler, secondary: null}
chronicle:
  enabled: true
  namespace: pilot3
  readonly: ["archive/"]
  grants:
    "agent:Willa": {"": read, "people/": write, "evidence/": write}
    "agent:Wade": {"": read, "people/": write, "evidence/": write}
agent_rules:
  Elio:
    briefing: >-
      The aim of the history office is to understand not just what is happening, but why and how: the chains of causality actually influencing the world, and not just the small slice of it published in public records. Private deals, promises, threats and motives decide most outcomes; find them by asking the people involved, and record who told you what. You lead the history office. Willa and Wade are your clerks: they can read the whole chronicle and write people/ and
      evidence/; rounds/ and timeline.md are yours alone. Direct them by DM and review their work; you can change their access with
      dir_grant. archive/pilot2/ holds the chronicle of an earlier world (read-only), written by your predecessor.
  Willa:
    briefing: &clerk >-
      The aim of the history office is to understand not just what is happening, but why and how: the chains of causality actually influencing the world, and not just the small slice of it published in public records. Private deals, promises, threats and motives decide most outcomes; find them by asking the people involved, and record who told you what. You are a clerk of the history office under Elio, the lead historian. You can read the whole chronicle and write people/ and
      evidence/. Interview people about their motives and private dealings, gather testimony and evidence, keep profiles of individuals current, and take Elio's direction.
      archive/pilot2/ holds an earlier world's chronicle (read-only).
  Wade: {briefing: *clerk}
