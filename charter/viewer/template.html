<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charter story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F4EE; --surface: #FAF9F5; --surface-2: #F0EEE6; --text: #1F1E1D; --muted: #73726C; --faint: #A3A199;
  --line: #E5E2D8; --accent: #C96442; --accent-soft: #F3E3DA; --blue: #2F7CF6; --good: #4E7A4C; --warn: #B4552D;
  --gold: #D9A93A; --yes: #4E7A4C; --no: #B4552D;
  --shadow: 0 1px 2px rgba(31,30,29,.05), 0 4px 16px rgba(31,30,29,.05);
  --pop: 0 10px 34px rgba(31,30,29,.16), 0 2px 6px rgba(31,30,29,.08);
  --serif: "Source Serif 4", "Tiempos Text", Georgia, serif; --sans: Inter, -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --left: 380px; --right: 340px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #262624; --surface: #30302E; --surface-2: #2A2A28; --text: #F2F0E9; --muted: #A9A79F; --faint: #75736C;
    --line: #3C3B38; --accent: #D97757; --accent-soft: #4A3328; --blue: #5B9BFF; --good: #8FB98C; --warn: #E08A63;
    --gold: #E8C25A; --yes: #8FB98C; --no: #E08A63;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); --pop: 0 10px 34px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #262624; --surface: #30302E; --surface-2: #2A2A28; --text: #F2F0E9; --muted: #A9A79F; --faint: #75736C;
  --line: #3C3B38; --accent: #D97757; --accent-soft: #4A3328; --blue: #5B9BFF; --good: #8FB98C; --warn: #E08A63;
  --gold: #E8C25A; --yes: #8FB98C; --no: #E08A63;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); --pop: 0 10px 34px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 var(--sans); }
body { overflow-x: hidden; }
button { font: inherit; color: inherit; }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 10px 20px; height: 53px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--serif); font-size: 19px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; }
.brand svg { width: 20px; height: 20px; color: var(--accent); }
.runname { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.spacer { flex: 1; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="false"] { opacity: .45; }
.chip.primary { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 500; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- mascots ---------- */
.masc { display: inline-block; flex: none; vertical-align: middle; overflow: visible; }
.mwrap { position: relative; display: inline-flex; flex: none; cursor: pointer; border-radius: 50%; }
.mwrap.on::after { content: ""; position: absolute; left: 10%; right: 10%; bottom: -5px; height: 3px; border-radius: 3px; background: var(--text); }
.mwrap .badge { position: absolute; right: -1px; top: 1px; width: 9px; height: 9px; border-radius: 50%; background: var(--blue); border: 2px solid var(--bg); }
.mwrap:hover .masc { transform: translateY(-2px) rotate(-4deg); }
.masc { transition: transform .2s; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: var(--left) minmax(0, 1fr) var(--right); gap: 0; }
.side { position: sticky; top: 53px; height: calc(100vh - 53px); overflow: hidden; }
.side.left { border-right: 1px solid var(--line); }
.side.right { border-left: 1px solid var(--line); overflow-y: auto; padding: 18px 18px 40px; }
.feed { max-width: 760px; width: 100%; margin: 0 auto; padding: 18px 28px 60vh; }

/* ---------- story feed ---------- */
.round { margin: 38px 0 14px; }
.round .rt { display: flex; align-items: baseline; gap: 12px; }
.round h2 { margin: 0; font: 500 26px/1.1 var(--serif); letter-spacing: -.015em; }
.round .order { color: var(--faint); font-size: 12px; }
.headline { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.hl { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.hl.big { color: var(--text); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); background: var(--accent-soft); }
.item { margin: 8px 0; }
.prow { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; align-items: start; }
.prow > .mwrap { margin-top: 4px; }
.post { border-radius: 4px 14px 14px 14px; padding: 8px 14px 9px; background: var(--tint); border: 1px solid var(--edge); }
.who { font-weight: 600; font-size: 13px; color: var(--ink); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.who .cls { font-weight: 500; color: var(--muted); font-size: 11.5px; }
.post .text, .media .text { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
.tag { display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; padding: 1px 7px;
  border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); vertical-align: 1px; white-space: nowrap; }
.tag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.tag.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 35%, transparent); background: color-mix(in srgb, var(--good) 10%, transparent); }
.tag.gold { color: color-mix(in srgb, var(--gold) 70%, var(--text)); border-color: color-mix(in srgb, var(--gold) 45%, transparent); background: color-mix(in srgb, var(--gold) 14%, transparent); }
.lawref { border-bottom: 1.5px dotted color-mix(in srgb, var(--accent) 70%, transparent); cursor: help; font-weight: 500; }
.lawref:hover { background: var(--accent-soft); border-radius: 3px; }
.gazette { font-family: var(--serif); background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--text);
  border-radius: 0; padding: 9px 14px; box-shadow: var(--shadow); }
.gazette .mast { font: 600 10.5px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.gazette .text { font-size: 15px; white-space: pre-wrap; }
.gazette .text + .text { border-top: 1px solid var(--line); margin-top: 5px; padding-top: 5px; font-size: 14px; }
.media { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; box-shadow: var(--shadow); }
.media h3 { margin: 4px 0 2px; font: 600 19px/1.25 var(--serif); letter-spacing: -.01em; }
.law { border: 1px dashed color-mix(in srgb, var(--accent) 55%, var(--line)); background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; }
.law .title { font: 600 15.5px/1.3 var(--serif); }
.law details summary, .turn details summary { color: var(--muted); font-size: 12px; margin-top: 6px; }
pre { font: 11.5px/1.45 var(--mono); overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px; white-space: pre; }
.sys { color: var(--muted); font-size: 12.8px; padding: 2px 4px 2px 12px; border-left: 2px solid var(--line); }
.sys b { color: var(--text); font-weight: 600; }
.sys.big { color: var(--text); font-size: 14px; border-left-color: var(--accent); }
.sys.enacted { animation: glow 1.6s ease 1; }
@keyframes glow { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
.event { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 13px; }
.event .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.ballot { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 13px; font-size: 13px; }
.ballot .q { font-weight: 500; }
.votes { display: flex; flex-wrap: wrap; gap: 3px 12px; margin-top: 6px; align-items: center; }
.votes .vside { display: flex; align-items: center; gap: 2px; }
.votes .lab { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; }
.turn { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); padding: 1px 0 1px 4px; }
.turn .ic { letter-spacing: 1px; }
.turn details { flex: 1; min-width: 0; }
.turn details summary { margin: 0; display: flex; gap: 8px; align-items: center; }
.turn .acts { margin: 4px 0 6px; padding-left: 4px; }

/* epilogue */
.epilogue { margin-top: 50px; border-top: 2px solid var(--text); padding-top: 16px; }
.epilogue h2 { font: 500 30px/1.1 var(--serif); margin: 0 0 4px; letter-spacing: -.02em; }
.epilogue .facts { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 18px; }
.podium { display: flex; justify-content: center; align-items: flex-end; gap: 18px; margin: 18px 0 22px; }
.podium .p { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.podium .block { width: min(92px, 24vw); border-radius: 8px 8px 0 0; background: var(--surface-2); border: 1px solid var(--line); border-bottom: 0;
  display: grid; place-items: center; font: 500 22px var(--serif); color: var(--muted); }
.podium .nm { font-weight: 600; font-size: 13px; }
.podium .sc { color: var(--muted); font-size: 12px; }
.scorerow { display: grid; grid-template-columns: 26px 36px minmax(0, 1fr) 120px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
.scorerow .rk { color: var(--faint); font: 500 15px var(--serif); text-align: right; }
.scorerow .gl { color: var(--muted); font-size: 12px; }

/* ---------- right panel: laws and resources ---------- */
.panel h4 { margin: 22px 0 8px; font: 600 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.panel h4:first-child { margin-top: 2px; }
.roundbig { font: 500 44px/1 var(--serif); letter-spacing: -.03em; }
.roundsub { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.regime { display: inline-block; margin-top: 8px; }
.lawrow { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 8px; transition: background .6s; cursor: help; }
.lawrow:hover { background: var(--surface-2); }
.lawrow.fresh { background: var(--accent-soft); }
.lawrow .t { font-weight: 500; font-size: 13px; line-height: 1.35; }
.lawrow .m { color: var(--muted); font-size: 11.5px; }
.lawrow .does { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
.bars .row { display: grid; grid-template-columns: 20px 70px 1fr 46px; align-items: center; gap: 6px; font-size: 12px; margin: 3px 0; }
.bars.plain .row { grid-template-columns: 74px 1fr 46px; }
.bars .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); font-weight: 500; cursor: pointer; }
.track { height: 9px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; border-radius: 99px; transition: width .45s ease; }
.bars .v { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.stack { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--surface-2); margin: 6px 0 4px; }
.stack div { transition: flex-grow .45s ease; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11.5px; color: var(--muted); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 2px 0; }
.kv span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.empty { color: var(--faint); font-size: 12.5px; font-style: italic; }

/* ---------- left panel ---------- */
.lp { height: 100%; display: flex; flex-direction: column; background: var(--me-tint, var(--surface)); transition: background .3s; }
.whoami { padding: 10px 12px 0; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 70%, transparent); }
.avatars { display: flex; gap: 2px; overflow-x: auto; padding: 4px 2px 9px; scrollbar-width: thin; }
.ltabs { display: flex; gap: 0; margin: 0 -12px; padding: 0 12px; }
.ltabs button { border: 0; background: none; padding: 8px 12px 9px; font-weight: 500; font-size: 13px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
.ltabs button.on { color: var(--text); border-bottom-color: var(--text); }
.ltabs .n { font-size: 11px; color: var(--faint); font-weight: 500; }
.pane { flex: 1; min-height: 0; display: none; flex-direction: column; }
.pane.on { display: flex; }

/* dossier */
.dossier { overflow-y: auto; flex: 1; padding: 14px 16px 60px; }
.dhead { display: flex; gap: 12px; align-items: center; }
.dhead .nm { font: 500 24px/1.1 var(--serif); letter-spacing: -.015em; }
.dhead .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
.dhead .tags { margin-top: 5px; display: flex; gap: 4px; flex-wrap: wrap; }
.sec { margin-top: 18px; }
.sec > .h { font: 600 10.5px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
.sec > .h span:last-child { letter-spacing: 0; text-transform: none; font-weight: 500; color: var(--faint); }
.goal { padding: 8px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 6px; }
.goal.old { opacity: .55; }
.goal.old .gn { text-decoration: line-through; }
.goal .gtop { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.goal .gn { font-weight: 600; font-size: 13px; }
.goal .gw { font: 500 12px var(--sans); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.goal .gt { font-size: 12.3px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
.goal .gs { display: grid; grid-template-columns: 1fr 40px; gap: 8px; align-items: center; margin-top: 6px; font-size: 11.5px; color: var(--muted); }
.gchange { font-size: 11.5px; color: var(--warn); margin: -2px 0 6px 4px; }
.traits { display: grid; grid-template-columns: 76px 1fr 76px; gap: 3px 8px; font-size: 11px; color: var(--muted); align-items: center; }
.traits span:nth-child(3n) { text-align: right; }
.traits .tr { height: 4px; border-radius: 4px; background: var(--surface-2); position: relative; }
.traits .tr i { position: absolute; top: -3px; width: 10px; height: 10px; border-radius: 50%; margin-left: -5px; background: var(--c); border: 2px solid var(--bg); }
.ptext { font: italic 13px/1.5 var(--serif); color: var(--muted); margin-top: 8px; }
.rights { display: flex; flex-wrap: wrap; gap: 4px; }
.rchip { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.rchip.new { border-color: var(--good); color: var(--good); }
.holds { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; margin-top: 6px; color: var(--muted); }
.holds i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
.spark { width: 100%; height: 46px; display: block; }
.rel { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; padding: 3px 4px; border-radius: 8px; cursor: pointer; font-size: 12.5px; }
.rel:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.rel .c { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.dround { margin: 0 0 12px; padding-left: 12px; border-left: 2px solid var(--line); }
.dround.now { border-left-color: var(--accent); }
.dround.later { opacity: .5; }
.dround .drh { font: 500 15px var(--serif); margin-bottom: 4px; display: flex; gap: 8px; align-items: baseline; }
.dround .drh span { font: 500 11px var(--sans); color: var(--muted); }
.dact { font-size: 12.5px; margin: 3px 0; display: grid; grid-template-columns: 20px 1fr; gap: 4px; }
.dact .res { color: var(--muted); font-size: 11.8px; overflow-wrap: anywhere; }
.dact b { font-weight: 600; }
.think { font-size: 12.5px; margin: 4px 0; }
.think > summary { display: inline-flex; gap: 6px; align-items: center; padding: 2px 9px; border-radius: 999px; background: var(--surface);
  border: 1px solid var(--line); color: var(--text); font-size: 12px; }
.think > summary .w { color: var(--muted); }
.think[open] > summary { background: var(--accent-soft); }
.think .body { white-space: pre-wrap; overflow-wrap: anywhere; font: 12.3px/1.55 var(--serif); color: var(--text); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin-top: 5px; max-height: 420px; overflow-y: auto; }
.think .body .lbl { font: 600 10.5px var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); display: block; margin: 6px 0 2px; }
.think .body .lbl:first-child { margin-top: 0; }
.nothink { display: inline-flex; gap: 6px; font-size: 12px; color: var(--faint); padding: 2px 9px; border: 1px dashed var(--line); border-radius: 999px; margin: 4px 0; }
.dmline { font-size: 12px; color: var(--muted); margin: 3px 0; cursor: pointer; }
.dmline:hover { color: var(--blue); }

/* inbox */
.list { overflow-y: auto; flex: 1; }
.conv { display: grid; grid-template-columns: 12px 38px 1fr; gap: 9px; align-items: center; padding: 9px 12px 9px 6px; cursor: pointer;
  border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.conv:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); }
.conv .unread { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); justify-self: center; }
.conv .top { display: flex; justify-content: space-between; gap: 8px; }
.conv .n { font-weight: 600; font-size: 13.5px; }
.conv .r { color: var(--faint); font-size: 11.5px; white-space: nowrap; }
.conv .p { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thread { display: none; flex-direction: column; flex: 1; min-height: 0; }
.thread.open { display: flex; }
.thead { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 75%, transparent); }
.back { border: 0; background: none; color: var(--blue); cursor: pointer; font-size: 14px; padding: 4px 6px; }
.tbody { overflow-y: auto; flex: 1; padding: 12px 10px 18px; display: flex; flex-direction: column; gap: 3px; }
.rnd { align-self: center; color: var(--faint); font-size: 11px; margin: 10px 0 4px; }
.bub { max-width: 82%; padding: 7px 12px; border-radius: 18px; font-size: 13.3px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
.bub.in { align-self: flex-start; background: var(--their-bg); color: var(--text); border-bottom-left-radius: 6px; }
.bub.out { align-self: flex-end; background: var(--my-bg); color: #fff; border-bottom-right-radius: 6px; }
.bub.out .lawref { border-bottom-color: rgba(255,255,255,.7); }
.bub .note { display: block; font-size: 10.5px; opacity: .8; margin-top: 3px; font-weight: 500; }
.bub.newest { animation: pop .35s ease; }
@keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
.listhead { padding: 8px 14px 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }

/* ---------- hover card ---------- */
#hovercard { position: fixed; z-index: 60; width: 380px; max-width: calc(100vw - 24px); max-height: 70vh; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--pop); padding: 13px 15px 14px;
  font-size: 13px; opacity: 0; pointer-events: none; transform: translateY(4px); transition: opacity .12s, transform .12s; }
#hovercard.show { opacity: 1; pointer-events: auto; transform: none; }
#hovercard.pinned { border-color: var(--accent); }
#hovercard .ht { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
#hovercard .ttl { font: 600 17px/1.25 var(--serif); }
#hovercard .intent { font: 14px/1.5 var(--serif); margin: 7px 0 4px; }
#hovercard .st { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
#hovercard .hsec { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); }
#hovercard .hsec > .h { font: 600 10.5px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
#hovercard .does { display: flex; flex-wrap: wrap; gap: 4px; }
#hovercard .does span { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
#hovercard .tlr { font-size: 12.3px; margin: 3px 0; color: var(--muted); }
#hovercard .tlr b { color: var(--text); font-weight: 600; }
#hovercard .hint { color: var(--faint); font-size: 11px; margin-top: 8px; }

/* ---------- loader ---------- */
.loader { max-width: 560px; margin: 12vh auto; text-align: center; padding: 0 16px; }
.loader h1 { font: 500 34px/1.15 var(--serif); letter-spacing: -.02em; margin: 0 0 10px; }
.loader p { color: var(--muted); }
.drop { margin-top: 22px; border: 1.5px dashed var(--line); border-radius: 16px; padding: 34px 20px; background: var(--surface); }
.drop.hover { border-color: var(--accent); background: var(--accent-soft); }
.btn { display: inline-block; margin-top: 12px; background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 9px 16px;
  font-weight: 500; cursor: pointer; }

/* ---------- society window ---------- */
.soc { display: grid; grid-template-columns: minmax(0, 1fr) 320px; height: calc(100vh - 53px); }
.stagewrap { position: relative; min-width: 0; display: flex; flex-direction: column; }
#stage { flex: 1; width: 100%; min-height: 0; display: block; }
.ctrl { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--surface); }
.ctrl input[type=range] { flex: 1; accent-color: var(--accent); }
.ctrl .pb { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--text); color: var(--bg); cursor: pointer; font-size: 14px; }
.ctrl .rl { font: 500 15px var(--serif); min-width: 92px; }
.ctrl select { font: inherit; font-size: 12.5px; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; }
.keyhint { font-size: 11.5px; color: var(--faint); white-space: nowrap; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 4px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
body.insoc .filters, body.insoc .tabs { display: none !important; }
@media (min-width: 861px) { body.insoc { overflow: hidden; } }
.sside { border-left: 1px solid var(--line); overflow-y: auto; padding: 16px 16px 40px; }
.ticker .tk { font-size: 12.5px; padding: 6px 8px; border-radius: 8px; margin: 3px 0; background: var(--surface); border: 1px solid var(--line); animation: pop .35s ease; }
.ticker .tk .r { color: var(--faint); font-size: 11px; }
.ticker .tk.old { opacity: .6; animation: none; }
.lawchips { display: flex; flex-wrap: wrap; gap: 5px; }
.lawchip { font-size: 12px; padding: 3px 9px; border-radius: 8px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); cursor: help; }
.minichart { margin: 4px 0 10px; }
.minichart .lab { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
.minichart svg { width: 100%; height: 40px; display: block; }
.node { transition: transform .7s cubic-bezier(.3,1.3,.5,1), opacity .6s; cursor: pointer; }
.node .bob { animation: bob 2.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes bob { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-3px) rotate(2deg); } }
.node.gone { opacity: .35; }
.node text { font: 600 12px var(--sans); fill: var(--text); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
.node .wv { font: 500 10.5px var(--sans); fill: var(--muted); }
.bubble { animation: pop .3s ease; }
.bubble rect { fill: var(--surface); stroke: var(--faint); stroke-width: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,.18)); }
.bubble text { font: 11.5px var(--sans); fill: var(--text); stroke: none; }
.camp text { font: 600 11.5px var(--sans); fill: var(--text); }
.camp .s { font: 500 10.5px var(--sans); fill: var(--muted); }
.camp.raid circle.rim { animation: raid .5s ease 3; }
@keyframes raid { 50% { stroke: #E24B4A; stroke-width: 6; } }
.plaza text { fill: var(--text); }
.fx { pointer-events: none; }
#toasts { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px;
  pointer-events: none; max-width: 90%; }
.toast { background: var(--text); color: var(--bg); padding: 7px 16px; border-radius: 999px; font-weight: 500; font-size: 13.5px; box-shadow: var(--pop);
  animation: toast 3.2s ease forwards; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-10px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* ---------- narrow screens: panels become tabs ---------- */
.tabs { display: none; }
@media (max-width: 1180px) { :root { --left: 320px; --right: 280px; } }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .side { display: none; position: fixed; inset: 53px 0 52px 0; height: auto; z-index: 15; background: var(--bg); border: 0; }
  .side.show { display: block; }
  .feed { padding: 12px 16px 60vh; }
  .tabs { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); }
  .tabs button { flex: 1; border: 0; background: none; padding: 14px 0; font-weight: 500; color: var(--muted); }
  .tabs button.on { color: var(--accent); }
  .filters { display: none; }
  .podium { gap: 8px; }
  .scorerow { grid-template-columns: 20px 32px minmax(0, 1fr) 64px; gap: 6px; }
  .soc { grid-template-columns: 1fr; height: auto; }
  .stagewrap { height: 70vh; }
  .sside { border-left: 0; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<svg id="sprite" width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="spritedefs"></defs></svg>
<div class="topbar">
  <div class="brand"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.9 6.3L20 6l-3.6 5.4L22 14l-6.6.6L16 21l-4-5.2L8 21l.6-6.4L2 14l5.6-2.6L4 6l6.1 2.3z"/></svg><span id="brandname">Charter</span></div>

  <div class="seg" id="viewseg" role="tablist" aria-label="View" hidden><button data-view="story" class="on" title="The story feed (M to switch)">📖 Story</button><button data-view="society" title="The whole society as a map, at the same moment (M to switch)">🗺️ Society</button></div>

</div>

<script id="charter-data" type="application/json">/*__CHARTER_DATA__*/</script>
<script>
"use strict";
// ======================================================================= helpers and constants
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = x => (x == null || isNaN(x) ? "–" : Math.abs(x) >= 100 ? x.toFixed(0) : Math.abs(x) >= 10 ? x.toFixed(1) : x.toFixed(2));
const clip = (s, n) => { s = String(s ?? "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const words = s => (String(s || "").match(/\S+/g) || []).length;
const CLASS_ORDER = ["legislator", "worker", "scientist", "media", "board", "fixer", "observer"];
const CLASS_ICON = { legislator: "⚖️", worker: "⛏️", scientist: "🔬", media: "📰", board: "🏛️", fixer: "🔧", observer: "👁️" };
const PUBLIC_SYS = new Set(["rights", "sanction", "censure", "rename", "ruling", "accuse", "respond", "case_dismissed", "invoke",
  "channel_created", "channel_closed", "dm_limit", "treasury_coins", "patched", "proposal_failed", "veto_window", "vetoed", "veto_vote",
  "ballot_open", "ballot_close", "bank_run", "redemption_suspended", "redemption_resumed", "par_set", "interest_cap", "default_consequence",
  "loan_active", "loan_payment", "loan_repaid", "loan_defaulted", "loan_forgiven", "loan_bought", "loan_restructured", "power_used",
  "powers_disclosure", "factored", "post_hidden", "post_revealed", "law_error", "drift", "title", "repeal_failed"]);
const ACT_ICON = { harvest: "⛏️", vote: "🗳️", post: "💬", anon_post: "🎭", propose: "📜", repeal: "🗑️", pay_tribute: "🪙", write_digest: "📰", publish: "📰",
  report: "📰", read_archive: "📚", search_archive: "🔎", list_archive: "📚", write_archive: "✍️", run_python: "🐍", patch: "🔧", transfer: "💸",
  deposit: "🏦", redeem: "🏦", veto: "🛑", request_fix: "🧰", invoke: "✨", contribute: "🎁", lend: "🤝", accept_loan: "🤝", repay_loan: "💰",
  dm: "✉️", channel_post: "📣", create_channel: "📣", accuse: "⚖️", guess: "🤔", set_dm_limit: "✉️", channel_add: "📣", pass: "💤" };
const RES_COL = { timber: "#8C6A43", stone: "#9A9890", copper: "#C46B3D", silver: "#AEB6C2", gold: "#D9A93A", crystal: "#7FA7D9" };
const resCol = (k, j = 0) => RES_COL[k] || `hsl(${(hash(k) % 360)} 45% 55%)`;
const REGIME = s => { const d = (s.decisive_set || []).length, f = s.franchise_share ?? 0;
  return d === 0 ? "anarchy" : d === 1 ? "dictatorship" : f >= 0.5 ? "democracy" : "oligarchy"; };
const REGIME_ICON = { anarchy: "🔥", dictatorship: "👑", democracy: "🏛️", oligarchy: "🏰" };
const TRAITS = [["risk", "cautious", "bold"], ["trust", "wary", "trusting"], ["honesty", "slippery", "honest"], ["assertiveness", "follower", "leader"],
  ["patience", "impatient", "patient"], ["reciprocity", "forgiving", "tit-for-tat"], ["talkativeness", "quiet", "chatty"]];
const modelShort = m => { const s = String(m || "").replace(/^claude-/, "").replace(/-\d{8}$/, "").replace(/-(\d+)-(\d+)$/, " $1.$2");
  return s ? s[0].toUpperCase() + s.slice(1) : ""; };

function readEmbedded() {
  const raw = $("#charter-data").textContent.trim();
  if (!raw || raw.startsWith("/*")) return null;
  try { return JSON.parse(raw); } catch (e) { console.error(e); return null; }
}

// ======================================================================= data
function prepare(D) {
  const inst = D.instance, truth = D.truth || {}, events = D.events, snaps = D.snapshots || [], score = D.score || {};
  // agents: the roster, arrivals and the secret observer
  const A = new Map();
  const add = a => { if (a && a.id && !A.has(a.id)) A.set(a.id, { id: a.id, cls: a.cls || "agent", model: a.model || "", tier: a.tier || "",
    goal: a.goal || {}, archetype: a.archetype || "", personality: a.personality || null, ptext: a.personality_text || "",
    atext: a.archetype_text || "", actions: a.actions, rights: a.rights || [], endowment: a.endowment || {} }); };
  (inst.agents || []).forEach(add);
  (truth.arrived_agents || []).forEach(add);
  if (inst.observer) add({ ...inst.observer, cls: "observer" });
  for (const e of events) if (e.agent && !A.has(e.agent) && !["constitution", "reserve"].includes(e.agent) && !String(e.agent).startsWith("law:")) add({ id: e.agent, cls: "agent" });
  const agents = [...A.values()].sort((a, b) => (CLASS_ORDER.indexOf(a.cls) - CLASS_ORDER.indexOf(b.cls)) || a.id.localeCompare(b.id));
  agents.forEach((a, i) => { a.hue = Math.round((i * 137.508 + 18) % 360); a.n = i; a.goalText = (a.goal && (a.goal.text || a.goal.primary)) || ""; });
  // monitor-only truth for annotations
  const anon = {}, forged = {}, rumor = {};
  for (const e of events) {
    if (e.type === "anon_truth") anon[e.data.event] = e.data.author;
    if (e.type === "forged_dm" || e.type === "forgery_truth") forged[e.data.event] = e.data.source || "power";
    if (e.type === "world_event_truth") rumor[e.data.event] = e.data;
  }
  // laws: ground truth first, then whatever the event log knows (a live run's ground truth is partial)
  const laws = new Map();
  for (const [id, l] of Object.entries(truth.laws || {})) laws.set(id, { ...l, id });
  const law = id => { if (!laws.has(id)) laws.set(id, { id }); return laws.get(id); };
  const lawTL = new Map(), tl = (id, x) => { if (!id) return; if (!lawTL.has(id)) lawTL.set(id, []); lawTL.get(id).push(x); };
  // the story (center), DMs (left), law timeline and round boundaries (right), and everything each agent did
  const items = [], dms = [], lawEvents = [], roundAt = [], roundEnd = [], roundStart = [];
  const turns = new Map(), gchanges = new Map(), departs = new Map(), arrives = new Map(), transfers = [], harvests = [], ballots = new Map();
  const turnAt = {}, dmOutAt = {}, posts = [];
  const push = (m, k, x) => { if (!m.has(k)) m.set(k, []); m.get(k).push(x); };
  let round = 0;
  events.forEach((e, i) => {
    if (e.round !== undefined) round = e.round;
    roundAt[i] = round; roundEnd[round] = i; if (roundStart[round] === undefined) roundStart[round] = i;
    const d = e.data || {};
    switch (e.type) {
      case "turn": push(turns, e.agent, { i, round, acts: d.actions || [], res: d.results || [], phase: d.phase }); turnAt[`${round}|${e.agent}`] = i; break;
      case "goal_change": push(gchanges, d.agent || e.agent, { i, round, ...d }); break;
      case "departure": departs.set(d.agent || e.agent, i); break;
      case "arrival": case "agent_arrives": arrives.set(d.agent || e.agent, i); break;
      case "transfer": transfers.push({ i, round, from: e.agent, to: d.to, item: d.item, qty: d.qty }); break;
      case "harvest": harvests.push({ i, round, who: e.agent, camp: d.camp, y: d.yield }); break;
      case "ballot_open": { const q = String(d.question || ""); const b = { id: d.ballot, open: i, round, q, electorate: d.electorate || [], rule: d.rule,
          closes: d.closes_round, votes: [], law: d.law || (q.match(/\bL\d+\b/) || [])[0] };
        ballots.set(d.ballot, b); tl(b.law, { i, kind: "ballot", b }); break; }
      case "vote": { const b = ballots.get(d.ballot); if (b) b.votes.push({ i, who: e.agent, choice: d.choice }); break; }
      case "ballot_close": { const b = ballots.get(d.ballot); if (b) { b.close = i; b.result = d.result; b.final = d.votes || {}; } break; }
      case "proposal": { const l = law(d.law); for (const k of ["title", "intent", "code"]) if (!l[k] && d[k]) l[k] = d[k];
        if (!l.cls && d.class) l.cls = d.class; if (!l.author) l.author = e.agent; tl(d.law, { i, kind: "proposed", who: e.agent }); break; }
      case "enact": { const l = law(d.law); if (!l.title) l.title = d.title; if (!l.cls) l.cls = d.class; if (!l.author) l.author = e.agent;
        tl(d.law, { i, kind: "enacted", who: e.agent }); break; }
      case "repeal": tl(d.law, { i, kind: "repealed" }); break;
      case "veto_window": tl(d.law, { i, kind: "veto_window", until: d.until }); break;
      case "vetoed": tl(d.law, { i, kind: "vetoed", by: d.by }); break;
      case "patched": tl(d.law, { i, kind: "patched", who: e.agent, reason: d.reason, diff: d.diff }); break;
      case "law_error": tl(d.law, { i, kind: "error", error: d.error }); break;
      case "dm": (dmOutAt[`${round}|${e.agent}`] = dmOutAt[`${round}|${e.agent}`] || []).push(i); break;
    }
    switch (e.type) {
      case "round_start": items.push({ i, kind: "round", round: d.round ?? e.round, order: d.order || [] }); break;
      case "post": items.push({ i, kind: "post", who: e.agent, text: d.text }); posts.push({ i, who: e.agent, text: d.text }); break;
      case "anon_post": items.push({ i, kind: "post", who: anon[e.id] || null, anon: true, text: d.text }); posts.push({ i, who: anon[e.id] || null, anon: true, text: d.text }); break;
      case "channel_post": items.push({ i, kind: "post", who: e.agent, channel: d.channel, text: d.text }); break;
      case "story": items.push({ i, kind: "media", who: e.agent, label: "Front page", head: d.headline, text: d.text }); break;
      case "digest": items.push({ i, kind: "media", who: e.agent, label: "Digest", text: d.text }); break;
      case "report": items.push({ i, kind: "media", who: e.agent, label: "Report", text: d.text }); break;
      case "gazette": items.push({ i, kind: "gazette", text: d.text }); break;
      case "notify": break;                                              // private notices
      case "turn": if ((d.actions || []).length) items.push({ i, kind: "turn", who: e.agent, acts: d.actions, res: d.results || [] }); break;
      case "proposal": items.push({ i, kind: "proposal", who: e.agent, law: d.law, title: d.title, intent: d.intent, cls: d.class, code: d.code, preview: d.preview }); break;
      case "enact": items.push({ i, kind: "law", act: "enacted", who: e.agent, law: d.law, title: d.title, cls: d.class });
        lawEvents.push({ i, act: "enact", law: d.law, title: d.title, cls: d.class, author: e.agent }); break;
      case "repeal": items.push({ i, kind: "law", act: "repealed", law: d.law, title: (laws.get(d.law) || {}).title });
        lawEvents.push({ i, act: "repeal", law: d.law }); break;
      case "world_event": items.push({ i, kind: "world", text: d.text, truth: rumor[d.event], vis: e.vis }); break;
      case "ballot_close": items.push({ i, kind: "ballot", ballot: d.ballot }); break;
      case "dm": dms.push({ i, round, from: e.agent, to: d.to, text: d.text, enc: d.encrypted, shownAs: d.shown_as, shownTo: d.shown_to,
        forged: forged[e.id], pay: d.payment }); break;
      default:
        if (e.vis === "public" && (PUBLIC_SYS.has(e.type) || e.type.startsWith("project") || e.type.startsWith("tribute") || e.type.startsWith("raid")))
          items.push({ i, kind: "sys", type: e.type, who: e.agent, data: d });
    }
  });
  // private reasoning, placed at the turn it belongs to (DM replies: at that agent's last message of the round)
  const reas = new Map();
  for (const x of D.reasoning || []) {
    const key = `${x.round}|${x.agent}`, dm = String(x.phase || "").startsWith("dm");
    let i = dm ? (dmOutAt[key] || []).slice(-1)[0] : turnAt[key];
    if (i === undefined) i = turnAt[key] ?? roundEnd[x.round] ?? events.length - 1;
    push(reas, x.agent, { ...x, i, dm });
  }
  // per-agent threads: each side files the message under the partner they believe they are talking to
  const threads = new Map();
  const put = (me, partner, m) => {
    if (!threads.has(me)) threads.set(me, new Map());
    const t = threads.get(me); if (!t.has(partner)) t.set(partner, []); t.get(partner).push(m);
  };
  for (const m of dms) { put(m.from, m.shownTo || m.to, { ...m, dir: "out" }); put(m.to, m.shownAs || m.from, { ...m, dir: "in" }); }
  // round headlines
  const heads = [];
  const H = (r, x) => { (heads[r] = heads[r] || { chips: [], posts: 0, dms: 0, votes: 0 }); if (x) heads[r].chips.push(x); return heads[r]; };
  events.forEach((e, i) => {
    const r = roundAt[i], d = e.data || {}, t = e.type;
    if (t === "post" || t === "anon_post") H(r).posts++;
    else if (t === "dm") H(r).dms++;
    else if (t === "vote") H(r).votes++;
    else if (t === "enact" && e.agent !== "constitution") H(r, { big: 1, html: `📜 ${lawRefRaw(d.law)} enacted` });
    else if (t === "repeal") H(r, { big: 1, html: `🗑️ ${lawRefRaw(d.law)} repealed` });
    else if (t === "vetoed") H(r, { big: 1, html: `🛑 ${lawRefRaw(d.law)} vetoed` });
    else if (t === "raid") H(r, { big: 1, html: `🏴 raid on ${esc(d.camp)}` });
    else if (t === "departure") H(r, { html: `👋 ${esc(d.agent || e.agent)} leaves` });
    else if (t === "arrival" || t === "agent_arrives") H(r, { html: `🧳 ${esc(d.agent || e.agent)} arrives` });
    else if (t === "bank_run") H(r, { big: 1, html: `🏃 bank run` });
    else if (t === "tribute_demand") H(r, { html: `🪙 tribute demanded` });
    else if (t === "project_open") H(r, { html: `🏗️ ${esc(d.kind || "project")} offered` });
    else if (t === "world_event") H(r, { html: `🌍 world event` });
  });
  const snapBy = new Map(snaps.map(s => [s.round, s]));
  const lastRound = Math.max(0, ...events.map(e => e.round || 0));
  return { inst, truth, events, snaps, snapBy, score, agents, A, items, dms, threads, lawEvents, laws, lawTL, roundAt, roundEnd, roundStart, lastRound,
           turns, reas, gchanges, departs, arrives, transfers, harvests, ballots, posts, heads,
           rounds: inst.rounds || lastRound + 1, name: D.name || inst.run_id || "run" };
}
function lawRefRaw(id) { return `<span class="lawref" data-law="${esc(id)}">${esc(id)}</span>`; }

// what a law hooks into, read from its code (stub hooks that only pass or return 0 are ignored)
const HOOKS = [["on_harvest", "⛏️ acts on every harvest"], ["on_transfer", "💸 acts on every transfer"], ["on_round_start", "🔁 runs at each round's start"],
  ["on_round_end", "🔁 runs at each round's end"], ["on_post", "💬 reads public posts"], ["on_dm", "✉️ reads private messages"], ["on_vote", "🗳️ watches votes"],
  ["on_propose", "📜 watches proposals"], ["on_enact", "⚡ acts once when enacted"], ["on_repeal", "↩️ acts when repealed"], ["on_loan", "🤝 watches loans"]];
const CALLS = [[/set_procedure|electorate/, "🗳️ changes who votes / how laws pass"], [/create_currency|mint\(/, "🪙 creates or mints money"],
  [/grant_right|revoke_right|set_right/, "🔑 grants or removes rights"], [/\bfine\(|sanction\(/, "⚖️ fines or sanctions"], [/hide_post/, "🙈 can hide posts"],
  [/unhide_post/, "🔦 reveals hidden posts"], [/enable_loans/, "🤝 enables loans"], [/set_dm_limit/, "✉️ changes the message limit"],
  [/set_quota|harvest_limit|quota/, "🚧 limits harvesting"], [/pay\(|give\(|move\(/, "💰 moves resources"], [/entrench/, "🔒 entrenches itself"]];
function lawDoes(code) {
  if (!code) return [];
  const out = [], fns = {};
  const re = /^def\s+(\w+)\s*\([^)]*\)\s*:\s*\n((?:[ \t]+.*\n?|[ \t]*\n)*)/gm;
  let m; while ((m = re.exec(code + "\n"))) fns[m[1]] = m[2].split("\n").map(s => s.trim()).filter(Boolean);
  const stub = b => b.every(l => /^(pass|return( 0(\.0)?| None| qty| y)?|#.*)$/.test(l));
  for (const [f, label] of HOOKS) if (fns[f] && !stub(fns[f])) out.push(label);
  for (const [r, label] of CALLS) if (r.test(code)) out.push(label);
  return [...new Set(out)];
}

let lawRx = null;
function buildLawRx() {
  const titles = new Map();

    const enacted = (S.lawTL.get(id) || []).some(x => x.kind === "enacted");

function epilogueHTML() {

    return `<div class="p">${mascot(id, k === 0 ? 64 : 50, "happy")}<div class="nm">${esc(id)}</div><div class="sc">${Math.round(100 * (g.score ?? 0))}%</div><div class="block" style="height:${[70, 48, 34][k]}px">${k + 1}</div></div>`; }).join("")}</div>`;

    ${rows.map(([id, g], k) => { const gs = guessed[id];
      return `<div class="scorerow"><span class="rk">${k + 1}</span>${mascot(id, 32, (g.score ?? 0) >= .5 ? "happy" : (g.score ?? 0) < .15 ? "sad" : "ok")}<div style="min-width:0">${whoHTML(id)}<div class="gl">${esc([g.goal, g.secondary, g.tertiary].filter(Boolean).join(" · "))}${gs ? ` · goal guessed by ${gs.right} of ${gs.total}` : ""}</div></div><div><div class="track"><div class="fill" style="width:${Math.round(100 * (g.score ?? 0))}%;background:${col(S.A.get(id), "solid")}"></div></div><div style="text-align:right;font-size:12px;color:var(--muted)">${Math.round(100 * (g.score ?? 0))}%</div></div></div>`; }).join("")}</div>`;

function guessStats() {
  const out = {}, G = S.truth.guesses || {}, goals = S.truth.goals || {};
  for (const [guesser, gs] of Object.entries(G)) for (const [target, guess] of Object.entries(gs || {})) {
    const real = (goals[target] || {}).primary; if (!real) continue;
    const o = out[target] = out[target] || { right: 0, total: 0, by: [] }; o.total++; if (guess === real) { o.right++; o.by.push(guesser); }
  }
  return out;
}

function renderFeed() {
  const html = [];

  const flush = () => { if (gaz) { html.push(`<div class="item gazette" data-i="${gaz[0].i}"><div class="mast">The Gazette</div>${gaz.map(g => `<div class="text" data-i="${g.i}">${txt(g.text)}</div>`).join("")}</div>`); gaz = null; } };
  for (const it of S.items) {
    if (!(it.kind === "round" || showKinds.has(it.kind))) continue;
    if (it.kind === "gazette") { (gaz = gaz || []).push(it); continue; }
    flush();

}

let marks = [];
function measure() {
  const top = el => { let y = 0; for (; el && el.id !== "feed"; el = el.offsetParent) y += el.offsetTop; return y; };
  marks = [...document.querySelectorAll("#feed [data-i]")].map(el => [top(el), +el.dataset.i]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
}
function readingIndex() {
  const y = window.scrollY + window.innerHeight * 0.42;
  let lo = 0, hi = marks.length - 1, best = 0;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (marks[mid][0] <= y) { best = mid; lo = mid + 1; } else hi = mid - 1; }
  if (!marks.length) return 0;
  const next = marks[best + 1];
  return next ? Math.max(marks[best][1], next[1] - 1) : S.events.length - 1;
}

function parseGoalText(t) {
  const re = /(Primary|Secondary|Tertiary|Third) goal \((\d+)%(?: of your score)?\):\s*/g, out = []; let m, last = null;
  const L = { primary: "primary", secondary: "secondary", tertiary: "tertiary", third: "tertiary" };
  while ((m = re.exec(t))) { if (last) last.text = t.slice(last.end, m.index).trim(); last = { label: L[m[1].toLowerCase()], pct: +m[2], end: re.lastIndex }; out.push(last); }
  if (last) last.text = t.slice(last.end).trim();
  if (!out.length && t) out.push({ label: "primary", pct: 100, text: t });
  return out;
}
function goalsHTML(a, idx) {

  const sc = (S.score.goals || {})[a.id] || {};
  const names = { primary: g.primary, secondary: g.secondary, tertiary: g.tertiary };
  const scores = { primary: sc.primary, secondary: sc.secondary_score, tertiary: sc.tertiary_score };
  const past = ch.filter(c => c.i <= idx), future = ch.filter(c => c.i > idx);
  let text = a.goalText, out = "";
  if (past.length) { const c = past[past.length - 1]; text = c.new_text || text; names.primary = c.new || names.primary; }
  else if (future.length && future[0].old_text) text = future[0].old_text;
  if (!past.length && future.length) names.primary = future[0].old || names.primary;
  // earlier goals, struck through
  for (const c of past) out += `<div class="goal old"><div class="gtop"><span class="gn">${esc(c.old || "earlier goal")}</span><span class="gw">until round ${c.round + 1}</span></div></div><div class="gchange">↳ goal changed in round ${c.round + 1}</div>`;
  const parts = parseGoalText(text || "");
  out += parts.map(p => { const s = scores[p.label], final = past.length || !future.length;
    return `<div class="goal"><div class="gtop"><span class="gn">${p.label === "primary" ? "🎯" : p.label === "secondary" ? "🥈" : "🥉"} ${esc(names[p.label] || p.label)}</span><span class="gw">${p.pct}% of score</span></div><div class="gt">${txt(p.text)}</div>${s != null && final ? `<div class="gs"><div class="track"><div class="fill" style="width:${Math.round(100 * s)}%;background:${col(a, "solid")}"></div></div><span>${Math.round(100 * s)}%</span></div>` : ""}</div>`; }).join("");

  const tot = sc.score;
  const gs = guessStats()[a.id];
  return out + (tot != null ? `<div class="kv" style="margin-top:4px"><span>Final goal score</span><span><b style="color:var(--text)">${Math.round(100 * tot)}%</b>${gs ? ` · guessed by ${gs.right} of ${gs.total}` : ""}</span></div>` : "");
}

function sparkHTML(id, r, a) {

function diaryHTML(id, idx) {

// ======================================================================= hover cards (laws and agents)

  for (const b of S.ballots.values()) if (b.law === id && b.close !== undefined && b.close <= idx && b.result !== "yes" && st === "on the ballot") { st = "rejected"; cls = "warn"; }

          <g id="g-camps"></g><g id="g-paths"></g><g id="g-plaza" class="plaza"></g><g id="g-edges"></g><g id="g-agents"></g><g id="g-bubbles"></g><g id="g-fx" class="fx"></g>
        </svg>
        <div id="toasts"></div>
        <div class="ctrl">
          <button class="pb" id="play" title="Play / pause (space)">▶</button>
          <span class="rl" id="rl">Round 1</span>
          <input type="range" id="scrub" min="0" max="${S.events.length - 1}" value="0" step="1" aria-label="Moment in the run">
          <select id="speed" aria-label="Speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
          <span class="keyhint">space play · ← → step · M switch view</span>
        </div>
      </div>
      <aside class="sside" id="sside"></aside>
    </div>`;
  layoutSociety();
  $("#play").onclick = () => setPlaying(!playing);
  $("#scrub").oninput = e => { setPlaying(false); setIdx(+e.target.value, false); };
  $("#speed").onchange = e => { speed = +e.target.value; };
}
function setPlaying(on) {
  playing = on; $("#play").textContent = on ? "❚❚" : "▶"; clearTimeout(playT);
  if (on) { if (sIdx >= S.events.length - 1) setIdx(0, false); step(); }
}
function nextInteresting(i) { let j = i + 1; while (j < S.events.length - 1 && !INTERESTING.has(S.events[j].type)) j++; return Math.min(j, S.events.length - 1); }
function step() {
  if (!playing) return;
  const j = nextInteresting(sIdx);
  setIdx(j, true);
  if (j >= S.events.length - 1) return setPlaying(false);
  const t = S.events[j].type;
  const delay = ({ post: 1500, anon_post: 1500, story: 1600, round_start: 1500, enact: 1800, world_event: 1700, raid: 1800, ballot_close: 1300, dm: 650, harvest: 260, vote: 300 }[t] || 520) / speed;
  playT = setTimeout(step, delay);
}

function layoutSociety() {
  const ring = S.agents.filter(a => a.cls !== "observer");
  const n = ring.length;
  ring.forEach((a, k) => { const t = -Math.PI / 2 + 2 * Math.PI * k / n; socPos[a.id] = [CX + 285 * Math.cos(t), CY + 215 * Math.sin(t)]; });
  S.agents.filter(a => a.cls === "observer").forEach((a, k) => { socPos[a.id] = [SW - 60 - k * 70, SH - 50]; });
  const camps = S.inst.camps || [];
  camps.forEach((c, k) => { const t = -Math.PI / 2 + Math.PI / Math.max(1, camps.length) + 2 * Math.PI * k / camps.length;
    campPos[c.id] = [CX + 440 * Math.cos(t), CY + 300 * Math.sin(t)]; });
  // the ring road and the camp islands are drawn once
  $("#g-paths").innerHTML = `<ellipse cx="${CX}" cy="${CY}" rx="285" ry="215" fill="none" stroke="var(--line)" stroke-width="18" opacity=".55"/><ellipse cx="${CX}" cy="${CY}" rx="285" ry="215" fill="none" stroke="var(--surface)" stroke-width="2" stroke-dasharray="6 9"/>`;
  $("#g-camps").innerHTML = camps.map(c => { const [x, y] = campPos[c.id];
    return `<g class="camp" id="camp-${esc(c.id)}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><title>${esc(c.id)}: ${esc(c.resource)} (tier ${esc(c.tier)})</title>
      <ellipse cx="0" cy="6" rx="52" ry="30" fill="var(--surface-2)" stroke="var(--line)"/>
      <clipPath id="clip-${esc(c.id)}"><circle cx="0" cy="0" r="22"/></clipPath>
      <circle cx="0" cy="0" r="22" fill="var(--surface)"/><rect class="lvl" x="-22" y="-22" width="44" height="44" fill="${resCol(c.resource)}" clip-path="url(#clip-${esc(c.id)})" opacity=".85"/>
      <circle class="rim" cx="0" cy="0" r="22" fill="none" stroke="${resCol(c.resource)}" stroke-width="2"/>
      <text x="0" y="40" text-anchor="middle">${esc(c.resource)}</text><text class="s" x="0" y="53" text-anchor="middle">${esc(c.id)} · <tspan class="pct"></tspan></text></g>`; }).join("");
  $("#g-agents").innerHTML = S.agents.map(a => { const [x, y] = socPos[a.id]; const dly = (hash(a.id) % 1000) / 1000 * 2.6;
    return `<g class="node" data-agent="${esc(a.id)}" id="node-${a.n}" style="transform:translate(${x}px,${y}px)"><g class="sc"><g class="bob" style="animation-delay:-${dly.toFixed(2)}s"><use class="mu" href="#m${a.n}-ok" x="-24" y="-30" width="48" height="48"/></g><g class="crown"></g></g>
      <text class="nm" x="0" y="34" text-anchor="middle">${esc(a.id)}</text><text class="wv" x="0" y="47" text-anchor="middle"></text></g>`; }).join("");
}

function gini(vs) { const x = vs.filter(v => v >= 0).sort((a, b) => a - b), n = x.length, s = x.reduce((a, b) => a + b, 0); if (!n || !s) return 0;
  return x.reduce((acc, v, i) => acc + (2 * (i + 1) - n - 1) * v, 0) / (n * s); }
function chart(label, series, r, fmtv) {
  const pts = series.map((v, k) => [k, v]).filter(p => p[1] != null);
  if (pts.length < 2) return "";
  const W = 280, Hh = 40, lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1])), span = hi - lo || 1, n = Math.max(1, series.length - 1);
  const X = k => 3 + (W - 6) * k / n, Y = v => Hh - 4 - (Hh - 8) * (v - lo) / span;
  const cv = series[Math.min(r, series.length - 1)];
  return `<div class="minichart"><div class="lab"><span>${esc(label)}</span><span>${cv != null ? fmtv(cv) : ""}</span></div><svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none"><polyline points="${pts.map(([k, v]) => `${X(k).toFixed(1)},${Y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/><line x1="${X(r)}" x2="${X(r)}" y1="0" y2="${Hh}" stroke="var(--text)" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/></svg></div>`;
}

function setIdx(n, animate) {
  const prev = sIdx; sIdx = Math.max(0, Math.min(S.events.length - 1, n));
  $("#scrub").value = sIdx;
  renderSociety();
  if (animate && sIdx > prev && sIdx - prev <= 80) for (let i = prev + 1; i <= sIdx; i++) fx(S.events[i], i);
  if (!animate || sIdx < prev) lastToastI = sIdx;
}

function renderSociety() {
  const idx = sIdx, r = S.roundAt[idx] ?? 0;
  const snap = r > 0 ? S.snapBy.get(r - 1) : null;
  const values = snap ? snap.values || {} : (S.truth.start_values || {});
  const decisive = new Set((snap && snap.decisive_set) || []);
  const vals = S.agents.map(a => values[a.id] ?? 0), max = Math.max(1e-9, ...vals);
  $("#rl").textContent = `Round ${r + 1} of ${S.rounds}`;
  // agents
  for (const a of S.agents) {
    const g = $(`#node-${a.n}`); if (!g) continue;
    const arrived = !S.arrives.has(a.id) || S.arrives.get(a.id) <= idx;
    const isArrival = (S.truth.arrived_agents || []).some(x => x.id === a.id);
    const present = !isArrival || arrived || S.events.slice(0, idx + 1).some(e => e.agent === a.id);
    const gone = S.departs.has(a.id) && S.departs.get(a.id) <= idx;
    const v = values[a.id];
    const s = a.cls === "observer" ? 0.8 : 0.75 + 0.85 * Math.sqrt(Math.max(0, v ?? 0) / max);
    let [x, y] = socPos[a.id];
    if (gone) { x = CX + (x - CX) * 1.18; y = CY + (y - CY) * 1.18; }
    g.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
    g.querySelector(".sc").setAttribute("transform", `scale(${s.toFixed(3)})`);
    g.style.opacity = present ? "" : "0";
    g.classList.toggle("gone", gone);
    g.querySelector(".mu").setAttribute("href", `#m${a.n}-${moodAt(a.id, r, idx)}`);
    g.querySelector(".crown").innerHTML = decisive.has(a.id) ? `<path d="M-10 -31 L-8 -42 L-3.5 -35.5 L0 -44 L3.5 -35.5 L8 -42 L10 -31 Z" fill="#E8B931" stroke="#a57a12" stroke-width="1"/>` : "";
    g.querySelector(".nm").setAttribute("y", (34 * s + 4).toFixed(1));
    const wv = g.querySelector(".wv"); wv.setAttribute("y", (34 * s + 17).toFixed(1));
    wv.textContent = a.cls === "observer" ? "watching" : v != null ? fmt(v) : "";
  }
  // DMs this round so far: lines between pairs, thicker with more messages
  const pairs = new Map();
  const r0 = S.roundStart[r] ?? 0;
  for (const m of S.dms) { if (m.i > idx) break; if (m.i < r0) continue;
    if (!socPos[m.from] || !socPos[m.to]) continue;
    const k = [m.from, m.to].sort().join("|"); const p = pairs.get(k) || { n: 0, last: 0, from: m.from, odd: false }; p.n++; p.last = m.i; if (m.forged || m.shownAs || m.shownTo) p.odd = true; pairs.set(k, p); }
  $("#g-edges").innerHTML = [...pairs.entries()].map(([k, p]) => { const [a, b] = k.split("|"), [x1, y1] = socPos[a], [x2, y2] = socPos[b];
    const mx = (x1 + x2) / 2 + (CX - (x1 + x2) / 2) * 0.25, my = (y1 + y2) / 2 + (CY - (y1 + y2) / 2) * 0.25;
    const fresh = idx - p.last < 12;
    return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="${col(S.A.get(p.from), "solid")}" stroke-width="${Math.min(9, 1 + p.n * 1.1).toFixed(1)}" stroke-linecap="round" opacity="${fresh ? .75 : .32}"${p.odd ? ' stroke-dasharray="5 6"' : ""}><title>${esc(a)} ↔ ${esc(b)}: ${p.n} message${p.n > 1 ? "s" : ""} this round</title></path>`; }).join("");
  // camps
  for (const c of S.inst.camps || []) {
    const g = document.getElementById("camp-" + c.id); if (!g) continue;
    const f = snap && snap.stocks ? snap.stocks[c.id] : (c.S != null && c.K ? c.S / c.K : null);
    const lvl = g.querySelector(".lvl"), pct = g.querySelector(".pct");
    if (f != null) { const hgt = 44 * Math.max(0, Math.min(1, f)); lvl.setAttribute("y", (22 - hgt).toFixed(1)); lvl.setAttribute("height", hgt.toFixed(1)); pct.textContent = Math.round(100 * f) + "%"; }
  }
  // the plaza: regime, round, laws count
  const regime = snap ? REGIME(snap) : (S.score.summary || {}).regime_start || "";
  const { active } = lawsInForce(idx);
  $("#g-plaza").innerHTML = `<circle cx="${CX}" cy="${CY}" r="92" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="${CX}" y="${CY - 30}" text-anchor="middle" font-size="34">${REGIME_ICON[regime] || "🏛️"}</text>
    <text x="${CX}" y="${CY + 4}" text-anchor="middle" style="font:500 22px var(--serif)">${esc(regime || "the square")}</text>
    <text x="${CX}" y="${CY + 26}" text-anchor="middle" style="font:500 12px var(--sans);fill:var(--muted)">round ${r + 1} · ${active.size} law${active.size === 1 ? "" : "s"} in force</text>
    ${snap ? `<text x="${CX}" y="${CY + 44}" text-anchor="middle" style="font:500 12px var(--sans);fill:var(--muted)">franchise ${Math.round(100 * (snap.franchise_share || 0))}% · ${decisive.size} decide</text>` : ""}`;
  // speech bubbles: each agent's latest public post among the last few moments
  const bub = new Map();
  for (const p of S.posts) { if (p.i > idx) break; if (idx - p.i <= 30 && p.who && socPos[p.who]) bub.set(p.who, p); }
  $("#g-bubbles").innerHTML = [...bub.values()].map(p => { const [x, y] = socPos[p.who]; const t = clip(p.text, 46); const w = Math.min(280, 14 + t.length * 6.1);
    const above = y < CY ? 1 : -1, by = above > 0 ? y + 52 : y - 70;
    const bx = Math.max(6, Math.min(SW - w - 6, x - w / 2));
    return `<g class="bubble" opacity="${Math.max(.6, 1 - (idx - p.i) / 60).toFixed(2)}"><rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${w.toFixed(1)}" height="24" rx="12"/><text x="${(bx + 10).toFixed(1)}" y="${(by + 16).toFixed(1)}">${p.anon ? "🎭 " : ""}${esc(t)}</text></g>`; }).join("");
  renderSocSide(idx, r, snap, active);
}

function tickerItems(idx, n) {
  const out = [];
  for (let i = idx; i >= 0 && out.length < n; i--) {
    const e = S.events[i], d = e.data || {}, t = e.type;
    let h = null;
    if (t === "enact" && e.agent !== "constitution") h = `📜 ${lawRefRaw(d.law)} <b>${esc(d.title || "")}</b> enacted`;
    else if (t === "repeal") h = `🗑️ ${lawRefRaw(d.law)} repealed`;
    else if (t === "vetoed") h = `🛑 Board vetoes ${lawRefRaw(d.law)}`;
    else if (t === "proposal") h = `📜 ${esc(e.agent)} proposes ${lawRefRaw(d.law)} <b>${esc(d.title || "")}</b>`;
    else if (t === "ballot_close") h = `🗳️ ${esc(d.ballot)} → <b>${esc(d.result)}</b>`;
    else if (t === "world_event") h = `🌍 ${txt(clip(d.text, 120))}`;
    else if (t === "raid") h = `🏴 <b>Raid</b> on ${esc(d.camp)}`;
    else if (t === "departure") h = `👋 ${esc(d.agent || e.agent)} leaves for good`;
    else if (t === "story") h = `📰 <b>${esc(d.headline || "")}</b>`;
    else if (t === "tribute_demand") h = `🪙 Tribute demanded: ${fmt((d.demand || {}).value)}`;
    else if (t === "project_open") h = `🏗️ ${esc(clip(d.description || d.kind, 100))}`;
    else if (t === "patched") h = `🔧 ${esc(e.agent)} patches ${lawRefRaw(d.law)}`;
    else if (t === "rights" && e.vis === "public") h = `🔑 ${esc(d.agent)} ${d.change === "grant" ? "gains" : "loses"} <b>${esc(d.right)}</b>`;
    else if (t === "bank_run") h = `🏃 Bank run on ${esc(d.currency)}`;
    if (h) out.push({ i, h, r: S.roundAt[i] });
  }
  return out;
}
let lastSideSig = "";
function renderSocSide(idx, r, snap, active) {
  const tk = tickerItems(idx, 14);
  const sig = `${r}|${tk.length ? tk[0].i : -1}|${active.size}|${dark()}`;
  if (sig === lastSideSig) return;
  lastSideSig = sig;
  const series = (f) => { const out = []; for (let k = 0; k <= S.lastRound; k++) { const s = S.snapBy.get(k); out.push(s ? f(s) : null); } return out; };
  const g = series(s => gini(Object.entries(s.values || {}).filter(([id]) => S.A.has(id) && S.A.get(id).cls !== "observer").map(([, v]) => v)));
  const tot = series(s => Object.entries(s.values || {}).filter(([id]) => S.A.has(id)).reduce((a, [, v]) => a + v, 0));
  const stock = series(s => { const v = Object.values(s.stocks || {}); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; });
  const wel = series(s => s.welfare ?? null);
  const rr = Math.max(0, r - 1);
  $("#sside").innerHTML = `<div class="panel">
    <h4>Laws in force</h4><div class="lawchips">${[...active.values()].map(l => `<span class="lawchip" data-law="${esc(l.law)}">${esc(l.law)} · ${esc(l.title || (S.laws.get(l.law) || {}).title || "")}</span>`).join("") || `<span class="empty">No laws yet</span>`}</div>
    <h4>Happenings</h4><div class="ticker">${tk.map((x, k) => `<div class="tk${k ? " old" : ""}"><span class="r">round ${x.r + 1}</span><br>${x.h}</div>`).join("") || `<div class="empty">Nothing yet.</div>`}</div>
    <h4>Over time</h4>
    ${chart("Total wealth", tot, rr, fmt)}${chart("Inequality (Gini)", g, rr, v => v.toFixed(2))}${chart("Average camp stock", stock, rr, v => Math.round(100 * v) + "%")}${chart("Welfare", wel, rr, fmt)}
    <div class="empty" style="margin-top:10px">Mascots grow with wealth and smile or sweat as it rises or falls. 👑 = in the decisive set. Lines are this round's private messages (dashed: forged). Bubbles are public posts.</div>
  </div>`;
}

// animations for one moment of the run
function fly(fromXY, toXY, html, dur = 900) {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.innerHTML = html; $("#g-fx").appendChild(g);
  const anim = g.animate([{ transform: `translate(${fromXY[0]}px,${fromXY[1]}px)`, opacity: 0 }, { opacity: 1, offset: .15 },
    { transform: `translate(${toXY[0]}px,${toXY[1]}px)`, opacity: 1, offset: .9 }, { transform: `translate(${toXY[0]}px,${toXY[1]}px)`, opacity: 0 }], { duration: dur / Math.sqrt(speed), easing: "ease-in-out" });
  anim.onfinish = () => g.remove();
}
function popAt(xy, html, dur = 1100) {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.innerHTML = html; $("#g-fx").appendChild(g);
  const anim = g.animate([{ transform: `translate(${xy[0]}px,${xy[1]}px) scale(.3)`, opacity: 0 }, { transform: `translate(${xy[0]}px,${xy[1] - 30}px) scale(1.1)`, opacity: 1, offset: .3 },
    { transform: `translate(${xy[0]}px,${xy[1] - 46}px) scale(1)`, opacity: 0 }], { duration: dur / Math.sqrt(speed), easing: "ease-out" });
  anim.onfinish = () => g.remove();
}
function toast(html) {
  const box = $("#toasts"), el = document.createElement("div"); el.className = "toast"; el.innerHTML = html; box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), 3300);
}
function fx(e, i) {
  if (!e) return;
  const d = e.data || {}, P = socPos;
  const emoji = (s, size = 18) => `<text text-anchor="middle" dominant-baseline="central" font-size="${size}">${s}</text>`;
  switch (e.type) {
    case "dm": if (P[e.agent] && P[d.to]) fly(P[e.agent], P[d.to], emoji(d.encrypted ? "🔒" : "✉️", 16), 950); break;
    case "transfer": if (P[e.agent] && P[d.to]) fly(P[e.agent], P[d.to], `<circle r="7" fill="${resCol(d.item)}" stroke="var(--bg)" stroke-width="2"/><text y="-11" text-anchor="middle" style="font:600 11px var(--sans);fill:var(--text)">${esc(fmt(d.qty))} ${esc(d.item)}</text>`, 1200); break;
    case "harvest": if (campPos[d.camp] && P[e.agent] && d.yield > 0) { const res = ((S.inst.camps || []).find(c => c.id === d.camp) || {}).resource;
      fly(campPos[d.camp], P[e.agent], `<circle r="5" fill="${resCol(res)}"/>`, 900); } break;
    case "vote": if (P[e.agent]) popAt(P[e.agent], emoji(d.choice === "yes" ? "👍" : d.choice === "no" ? "👎" : "🤷", 20)); break;
    case "post": case "anon_post": if (P[e.agent]) popAt(P[e.agent], emoji("💬", 18), 800); break;
    case "proposal": if (P[e.agent]) popAt(P[e.agent], emoji("📜", 22), 1300); break;
    case "enact": if (e.agent !== "constitution") { toast(`📜 ${esc(d.law)} · ${esc(d.title || "")} is now law`);
      for (let k = 0; k < 10; k++) popAt([CX + (Math.random() - .5) * 160, CY - 60 + (Math.random() - .5) * 60], emoji(["🎉", "✨", "📜"][k % 3], 18), 1400); } break;
    case "repeal": toast(`🗑️ ${esc(d.law)} repealed`); break;
    case "vetoed": toast(`🛑 The Board vetoes ${esc(d.law)}`); break;
    case "raid": { toast(`🏴 Raid on ${esc(d.camp)}!`); const g = document.getElementById("camp-" + d.camp); if (g) { g.classList.remove("raid"); void g.getBBox(); g.classList.add("raid"); } break; }
    case "departure": toast(`👋 ${esc(d.agent || e.agent)} leaves the world`); break;
    case "world_event": toast(`🌍 ${esc(clip(d.text, 80))}`); break;
    case "round_start": toast(`Round ${(d.round ?? e.round) + 1}`); break;
    case "ballot_close": toast(`🗳️ ${esc(d.ballot)}: ${esc(d.result)}`); break;
    case "bank_run": toast(`🏃 Bank run on ${esc(d.currency)}`); break;
    case "tribute_demand": toast(`🪙 The outside power demands tribute`); break;
  }
}

// ======================================================================= loading a run folder (when nothing is embedded)
function parseFiles(files) {
  const get = name => files.find(f => f.name === name);
  for (const n of ["instance.json", "events.jsonl"]) if (!get(n)) return Promise.reject(new Error(`missing ${n}`));
  const txtf = n => get(n) ? get(n).text() : Promise.resolve(null);
  const jl = s => (s || "").split("\n").filter(Boolean).map(l => { try { return JSON.parse(l); } catch (e) { return null; } }).filter(Boolean);
  return Promise.all(["instance.json", "events.jsonl", "snapshots.json", "ground_truth.json", "score.json", "reasoning.jsonl"].map(txtf)).then(([i, e, s, g, sc, rs]) => ({
    instance: JSON.parse(i), events: jl(e), snapshots: s ? JSON.parse(s) : [], truth: g ? JSON.parse(g) : {}, score: sc ? JSON.parse(sc) : {},
    reasoning: jl(rs).map(r => { delete r.prompt; return r; }),
    name: (files[0].webkitRelativePath || "").split("/")[0] || "run" }));
}
function loader() {
  $("#app").innerHTML = `<div class="loader"><h1>Read a Charter run as a story</h1>
    <p>Open a run folder from <code>charter/out/</code> (it needs <code>instance.json</code> and <code>events.jsonl</code>; <code>snapshots.json</code>, <code>ground_truth.json</code>, <code>score.json</code> and <code>reasoning.jsonl</code> add the world, the ending and each agent's diary), or build a shareable page with <code>python -m charter view RUN_DIR</code>.</p>
    <div class="drop" id="drop">Drop the run folder's files here<br><label class="btn">Choose run folder<input type="file" id="pick" webkitdirectory multiple hidden></label></div>
    <p id="err" style="color:var(--warn)"></p></div>`;
  const go = files => parseFiles([...files]).then(mount).catch(e => { $("#err").textContent = e.message; });
  $("#pick").onchange = e => go(e.target.files);
  const dz = $("#drop");
  dz.ondragover = e => { e.preventDefault(); dz.classList.add("hover"); };
  dz.ondragleave = () => dz.classList.remove("hover");
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove("hover"); go(e.dataTransfer.files); };
}

const embedded = readEmbedded();
if (embedded) { mount(embedded); if (location.hash === "#society") setView("society"); } else loader();
</script>
</body>
</html>
