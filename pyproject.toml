[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "charter"
version = "0.1.0"
description = "Charter: an economy-and-governance simulation builder for societies of LLM agents"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Zach Macsmith" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
api = ["anthropic>=0.70"]          # LLM_BACKEND=api; claude_code needs the `claude` CLI instead
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["charter*"]

[tool.setuptools.package-data]
charter = ["specs/*.yaml", "archive/**/*", "sandbox/*", "docs/*.md", "viewer/*"]
